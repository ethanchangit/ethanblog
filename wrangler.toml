name = "ethanblog"
pages_build_output_dir = "dist"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 + KV bindings for ethanblog Pages project.
# CI runs scripts/ensure-d1.sh before deploy to verify/create resources.
[[d1_databases]]
binding = "DB"
database_name = "ethanblog"
database_id = "1de188e2-c10c-42b9-86b8-709a27c88871"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSION"
id = "5b6b6d1c5e4347289c28c34954be8cfe"

# Guestbook mail lives on workers/guestbook (send_email is illegal on Pages).
# Deploy that Worker before `wrangler pages deploy`. No public internet secret:
# Pages calls it over this service binding.
[[services]]
binding = "GUESTBOOK"
service = "ethanblog-guestbook"
