{{ define "main" }}
  <article>
    <header class="mt-5 max-w-prose">
      <h1 class="text-4xl font-extrabold text-neutral-900 dark:text-neutral">{{ .Title }}</h1>
      {{ with .Params.experience.location }}
        <p class="mt-2 text-lg text-neutral-600 dark:text-neutral-400">{{ . }}</p>
      {{ end }}
    </header>

    <section class="mt-8 prose dark:prose-invert max-w-prose">
      {{ .Content }}
    </section>
  </article>
{{ end }}
