{{ define "main" }}
  <article>
    <header class="mt-5 max-w-prose">
      <h1 class="text-4xl font-extrabold text-neutral-900 dark:text-neutral">{{ .Title }}</h1>
      {{ with .Params.project }}
        <p class="mt-2 text-lg text-primary-600 dark:text-primary-400">{{ $.Description }}</p>
        <div class="mt-4 flex flex-wrap gap-2">
          {{ range .stack }}
            <span class="rounded-md bg-neutral-200 px-2 py-0.5 text-xs text-neutral-700 dark:bg-neutral-700 dark:text-neutral-300">{{ . }}</span>
          {{ end }}
        </div>
        {{ with .github }}
          <div class="mt-4">
            <a href="{{ . }}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 rounded-lg bg-neutral-900 px-4 py-2 text-sm font-medium text-white hover:bg-neutral-700 dark:bg-neutral-100 dark:text-neutral-900 dark:hover:bg-neutral-300">
              在 GitHub 查看
            </a>
          </div>
        {{ end }}
      {{ end }}
    </header>

    <section class="mt-8 prose dark:prose-invert max-w-prose">
      {{ .Content }}
    </section>
  </article>
{{ end }}
