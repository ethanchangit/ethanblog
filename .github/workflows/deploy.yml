name: Verify and publish blog

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 内容链接检查要 diff 到 PR base / 上一提交，浅克隆拿不到那个版本。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Validate content
        run: npm run validate:content

      - name: Validate changed content links
        env:
          STUDIO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: node scripts/validate-studio-links.mjs

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Keep the tested build
        uses: actions/upload-artifact@v4
        with:
          name: blog-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the tested build
        uses: actions/download-artifact@v4
        with:
          name: blog-${{ github.sha }}
          path: dist/

      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ethanblog --remote

      # send_email is illegal on Pages; the guestbook Worker must exist before
      # Pages service binding GUESTBOOK can resolve.
      - name: Deploy guestbook Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c workers/guestbook/wrangler.toml

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ethanblog --branch=main --commit-hash=${{ github.sha }}

      - name: Verify the published version
        run: node scripts/verify-deployment.mjs

      - name: Confirm dashboard publication and Heptabase properties
        env:
          STUDIO_SECRET: ${{ secrets.STUDIO_SECRET }}
        run: node scripts/notify-dashboard.mjs
