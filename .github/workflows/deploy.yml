name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Commit SHA selected by Ethan Blog Studio'
        required: false
        type: string
      studio_release_id:
        description: 'Ethan Blog Studio release request ID'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha || github.ref }}
          # PageHistory 在构建期读 git log；浅克隆会把提交史截成 1 条
          fetch-depth: 0

      - name: Verify selected revision
        if: ${{ inputs.expected_sha != '' }}
        run: test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Validate content
        run: npm run validate:content

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha || github.ref }}
          # PageHistory 在构建期读 git log；浅克隆会把提交史截成 1 条
          fetch-depth: 0

      - name: Verify selected revision
        if: ${{ inputs.expected_sha != '' }}
        run: test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Ensure D1 database and migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ensure-d1.sh

      # send_email is illegal on Pages; the guestbook Worker must exist before
      # Pages service binding GUESTBOOK can resolve.
      - name: Deploy guestbook Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c workers/guestbook/wrangler.toml

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ethanblog
